<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rogue Roll Output</title>
    <style>
    :root {
        --text: #f6f0dd;
        --muted: #b9ad92;
        --accent: #ffcf70;
        --blue: #82d8ff
    }

    * {
        box-sizing: border-box
    }

    body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: transparent;
        color: var(--text);
        font-family: "Trebuchet MS", Verdana, Arial, sans-serif;
        text-shadow:
            -1px -1px 0 #000,
             1px -1px 0 #000,
            -1px  1px 0 #000,
             1px  1px 0 #000
    }

    .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: transparent;
        box-shadow: none
    }

    .standby {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: .12em
    }

    .standby strong {
        display: block;
        margin-bottom: .75rem;
        color: var(--accent);
        font-size: clamp(1.5rem, 4vw, 3.5rem);
        text-shadow:
            0 0 14px rgba(255, 207, 112, .28),
            -1px -1px 0 #000,
             1px -1px 0 #000,
            -1px  1px 0 #000,
             1px  1px 0 #000
    }

    .roll {
        position: absolute;
        left: 0;
        width: 100%;
        padding: 0 1rem 7rem;
        text-align: center;
        text-shadow:
            -1px -1px 0 #000,
             1px -1px 0 #000,
            -1px  1px 0 #000,
             1px  1px 0 #000,
            0 0 10px rgba(255, 242, 210, .34)
    }

    .roll.ready {
        top: 2rem;
        max-height: calc(100vh - 4rem);
        overflow: hidden
    }

    .roll.playing {
        top: 100%;
        animation-name: rollUp;
        animation-timing-function: linear;
        animation-fill-mode: forwards
    }

    @keyframes rollUp {
        from {
            transform:translateY(0)
        }

        to {
            transform: translateY(calc(-100% - 100vh))
        }
    }

    .show-title {
        margin: 0 0 1rem;
        font-size: clamp(2.2rem, 6vw, 6rem);
        line-height: 1.02;
        text-transform: uppercase;
        letter-spacing: .08em
    }

    .subtitle {
        margin: 0 0 5rem;
        font-size: clamp(1.2rem, 2.2vw, 2rem);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: .14em
    }

    .section-heading {
        margin: 5rem 0 2.75rem;
        font-size: clamp(1.15rem, 2.5vw, 2.35rem);
        color: var(--accent);
        letter-spacing: .12em;
        text-transform: uppercase
    }

    .credit-entry {
        margin: 0 0 2.45rem
    }

    .credit-name {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.8rem, 3.9vw, 3.6rem);
        line-height: 1.08;
        text-transform: uppercase;
        letter-spacing: .04em
    }

    .credit-title {
        margin-top: .35rem;
        color: var(--muted);
        font-size: clamp(1rem, 1.9vw, 1.55rem);
        line-height: 1.35
    }

    /* In-roll version: same visual style, natural flow */
    .final-card {
        margin: 6rem auto 1rem;
        width: min(780px, 92%);
        color: var(--blue);
        font-size: clamp(1.25rem, 2.8vw, 2.45rem);
        line-height: 1.35;
        text-transform: uppercase;
        letter-spacing: .09em
    }

    /* Fixed overlay version that "catches" the card at center */
    .final-card-fixed {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(780px, 92%);
        color: var(--blue);
        font-size: clamp(1.25rem, 2.8vw, 2.45rem);
        line-height: 1.35;
        text-transform: uppercase;
        letter-spacing: .09em;
        text-align: center;
        text-shadow:
            -1px -1px 0 #000,
             1px -1px 0 #000,
            -1px  1px 0 #000,
             1px  1px 0 #000;
        z-index: 10;
        pointer-events: none
    }

    .finfin-sprite {
        position: fixed;
        width: 150px;
        height: auto;
        z-index: 20;
        pointer-events: none;
        will-change: transform;
    }
    </style>
</head>
<body>
    <div id="finfin-container"></div>
    <main class="stage">
        <div id="standby" class="standby">
            <div>
                <strong>Rogue Roll Output</strong>
                Waiting for credits from the control page
            </div>
        </div>
        <div id="roll" class="roll ready" aria-live="polite"></div>
        <div id="final-card-fixed" class="final-card-fixed">
            No chatters were harmed<br>
            in the making of this livestream<br>
            &lt;&gt;
        </div>
    </main>
    <script>
    const roll = document.getElementById("roll");
    const standby = document.getElementById("standby");
    const finalCardFixed = document.getElementById("final-card-fixed");
    const finfinContainer = document.getElementById("finfin-container");
    let lastCommandAt = 0;
    let trackingRaf = null;

    // FinFin Settings
    const finfinGifs = [
        'finfinDislike.gif',
        'finfinEatElmo.gif',
        'finfinGetAttention.gif',
        'finfinPleased.gif',
        'finfinSing_1.gif',
        'finfinUncertain.gif',
        'finfinWave.gif',
        'finfinWriting.gif',
        'finfinhandsup.gif',
        'finfinheadshakebellyslap.gif'
    ];
    let sprites = [];
    let animationFrameId = null;

    class FinFinSprite {
        constructor() {
            this.el = document.createElement("img");
            this.el.className = "finfin-sprite";
            this.changeGif();

            // Random start position
            this.x = Math.random() * (window.innerWidth - 150);
            this.y = Math.random() * (window.innerHeight - 150);

            // Random velocity
            const speed = 3 + Math.random() * 3;
            const angle = Math.random() * Math.PI * 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;

            finfinContainer.appendChild(this.el);
        }

        changeGif() {
            const gif = finfinGifs[Math.floor(Math.random() * finfinGifs.length)];

            // To restart the gif without forcing a network request each time,
            // we clone the element and replace it.
            const newEl = this.el.cloneNode(true);
            newEl.src = `/static/finfin/${gif}`;
            if (this.el.parentNode) {
                this.el.parentNode.replaceChild(newEl, this.el);
            }
            this.el = newEl;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;

            const w = window.innerWidth;
            const h = window.innerHeight;
            const spriteSize = 150; // approximate width/height

            let bounced = false;

            if (this.x <= 0) {
                this.x = 0;
                this.vx *= -1;
                bounced = true;
            } else if (this.x >= w - spriteSize) {
                this.x = w - spriteSize;
                this.vx *= -1;
                bounced = true;
            }

            if (this.y <= 0) {
                this.y = 0;
                this.vy *= -1;
                bounced = true;
            } else if (this.y >= h - spriteSize) {
                this.y = h - spriteSize;
                this.vy *= -1;
                bounced = true;
            }

            if (bounced) {
                this.changeGif();
            }

            this.el.style.transform = `translate(${this.x}px, ${this.y}px)`;
        }

        destroy() {
            this.el.remove();
        }
    }

    function animateFinFins() {
        sprites.forEach(sprite => sprite.update());
        animationFrameId = requestAnimationFrame(animateFinFins);
    }

    function updateFinFins(enabled, intensity) {
        if (!enabled) {
            sprites.forEach(s => s.destroy());
            sprites = [];
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            return;
        }

        const count = intensity;

        // Add sprites if needed
        while (sprites.length < count) {
            sprites.push(new FinFinSprite());
        }

        // Remove sprites if needed
        while (sprites.length > count) {
            const s = sprites.pop();
            s.destroy();
        }

        if (!animationFrameId && sprites.length > 0) {
            animateFinFins();
        }
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, m => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[m]))
    }
    function splitForSections(participants) {
        const specialCount = Math.min(8, Math.ceil(participants.length * 0.28));
        return {
            specialThanks: participants.slice(0, specialCount),
            chatRogues: participants.slice(specialCount)
        }
    }
    function entry(p) {
        return `<div class="credit-entry"><div class="credit-name">${escapeHtml(p.name)}</div><div class="credit-title">${escapeHtml(p.title || '')}</div></div>`
    }
    function render(payload) {
        const participants = Array.isArray(payload.participants) ? payload.participants : [];
        if (participants.length === 0) {
            standby.style.display = "grid";
            roll.innerHTML = "";
            return;
        }
        standby.style.display = "none";
        const sections = splitForSections(participants);
        roll.innerHTML = `<h1 class="show-title">The Modern Rogue Office Hours</h1><p class="subtitle">Today's Chat Credits</p><div class="section-heading">Special Thanks To</div>${sections.specialThanks.map(entry).join("")}<div class="section-heading">The Chat Rogues</div>${sections.chatRogues.map(entry).join("")}<div id="final-card-scroll" class="final-card">No chatters were harmed<br>in the making of this livestream<br>&lt;&gt;</div>`;
    }
    function trackFinalCard() {
        if (trackingRaf) cancelAnimationFrame(trackingRaf);
        finalCardFixed.style.display = "none";

        function check() {
            const scrollCard = document.getElementById("final-card-scroll");
            if (!scrollCard) return;

            const rect = scrollCard.getBoundingClientRect();
            const targetTop = (window.innerHeight - rect.height) / 2;

            if (rect.top <= targetTop) {
                // Card has reached center — hand off to the fixed overlay
                finalCardFixed.style.display = "block";
                scrollCard.style.visibility = "hidden";
                return;
            }
            trackingRaf = requestAnimationFrame(check);
        }
        trackingRaf = requestAnimationFrame(check);
    }
    function preview(payload) {
        if (trackingRaf) cancelAnimationFrame(trackingRaf);
        finalCardFixed.style.display = "none";
        render(payload);
        roll.className = "roll ready";
        roll.style.animationDuration = "";
    }
    function start(payload) {
        render(payload);
        roll.className = "roll playing";
        roll.style.animationDuration = `${payload.duration || 70}s`;
        roll.style.animationName = "none";
        roll.offsetHeight;
        roll.style.animationName = "";
        trackFinalCard();
    }
    function reset(payload) {
        preview(payload);
    }
    function handlePayload(payload) {
        if (!payload || payload.updatedAt <= lastCommandAt)
            return;
        lastCommandAt = payload.updatedAt;
        updateFinFins(payload.finfin_enabled, payload.finfin_intensity || 4);
        if (payload.action === "clear") {
            if (trackingRaf) cancelAnimationFrame(trackingRaf);
            finalCardFixed.style.display = "none";
            standby.style.display = "grid";
            roll.innerHTML = "";
            return;
        }
        if (payload.action === "start")
            start(payload);
        else if (payload.action === "reset")
            reset(payload);
        else
            preview(payload);
    }
    async function poll() {
        try {
            const r = await fetch('/api/command', {
                cache: 'no-store'
            });
            if (r.ok) {
                const data = await r.json();
                handlePayload(data);
            }
        } catch (e) {}
    }
    setInterval(poll, 1000);

    // Auto-start on load
    async function init() {
        try {
            await fetch('/api/autostart', {
                method: 'POST'
            });
            poll();
        } catch (e) {
            poll();
        }
    }
    init();
    </script>
</body>
</html>
